name: go-code-review
version: "1.0.1"

description: >
  An OpenEnv environment where AI agents review and fix buggy Go code.
  Agents must identify bugs and submit corrected source code across 3 tasks.

tags:
  - openenv
  - code-review
  - golang
  - software-engineering

tasks:
  - id: task1_syntax
    difficulty: easy
    description: Fix two logic bugs in a discount eligibility system
    max_steps: 3

  - id: task2_pointer
    difficulty: medium
    description: Find and fix a nil pointer panic
    max_steps: 3

  - id: task3_concurrency
    difficulty: hard
    description: Fix pagination and filtering bugs
    max_steps: 3

observation_space:
  type: object
  fields:
    task_id: string
    description: string
    difficulty: string
    buggy_code: string
    step:
      type: integer
      description: starts at 0
    max_steps: integer
    last_reward:
      type: float
      nullable: true
    done: boolean

action_space:
  type: object
  fields:
    issues_found:
      type: array
      items: string
    severity:
      type: string
      enum: [low, medium, high]
    fixed_code: string
    explanation:
      type: string
      nullable: true

reward:
  type: object
  fields:
    total: float
    review_score: float
    compile_score: float
    test_score: float
    issues_matched: integer
    issues_expected: integer
    tests_passed: integer
    tests_total: integer
    compile_error:
      type: string
      nullable: true

step_response:
  type: object
  fields:
    observation: object
    reward: object
    done: boolean
    info: object

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state