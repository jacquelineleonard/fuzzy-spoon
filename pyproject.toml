[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-spoon"
version = "0.1.0"
description = "Go Code Review OpenEnv Environment"
authors = [{name = "Jacqueline Leonard"}]
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "python-dotenv",
    "requests",
    "openenv-core>=0.2.0"
]

[project.scripts]
# This satisfies the "Missing [project.scripts] server entry point" error
fuzzy-spoon-server = "server.app:main"

[tool.openenv]
config = "openenv.yaml"
